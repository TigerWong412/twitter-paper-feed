name: Clean Google Sheet Duplicates

on:
  workflow_dispatch: # This line allows you to run it manually from the Actions tab

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this version if needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth-oauthlib

      - name: Create Service Account File from Secret
        # This securely creates the service_account.json file for the script to use
        run: echo "${{ secrets.GCP_SA_KEY }}" > service_account.json
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run the deduplication script
        run: python remove_duplicates.py
