name: Clean Google Sheet Duplicates

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Matches your other file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs only what's needed for the deduplicate script
          pip install gspread google-auth

      - name: Write Google credentials
        # This is the key step, copied from your working file
        # It assumes your secret is named GOOGLE_CREDENTIALS_B64
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 --decode > service_account.json

      - name: Validate credentials JSON
        # This is a great check to ensure the file was written correctly
        run: |
          python - << 'EOF'
          import json
          try:
              with open('service_account.json') as f:
                json.load(f)
              print('✅ service_account.json is valid JSON')
          except Exception as e:
              print(f'❌ ERROR: service_account.json is NOT valid JSON: {e}')
              exit(1)
          EOF

      - name: Run the deduplication script
        run: python remove_duplicates.py
