name: "🐦 Live Tweet Import-snscrape"

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:

jobs:
  live-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

     # 新增步骤：更新系统 CA 证书（关键修复）
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装最新版本的 snscrape
          pip install --upgrade requests gspread google-auth "snscrape>=0.6.2.20231122" certifi
         
      # 新增：设置环境变量，强制 Python 使用系统 CA 证书
      - name: Configure Python SSL certificates
        run: |
          echo "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV
          
      - name: Write Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 --decode > service_account.json

      - name: Validate credentials JSON
        run: |
          python - << 'EOF'
          import json
          with open('service_account.json') as f:
            json.load(f)
          print('✅ service_account.json is valid JSON')
          EOF

      - name: Run live import
        # 移除 TW_BEARER_TOKEN 环境变量（不再需要）
        run: |
          python monitor-snscrape.py --live  # 保持触发命令不变，但脚本内部逻辑已修改
