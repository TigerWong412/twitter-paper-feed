name: "🐦 Live Tweet Import — Nitter"

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点
  workflow_dispatch:

jobs:
  live-import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth beautifulsoup4 lxml certifi

      - name: Write Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 --decode > service_account.json

      - name: Validate credentials JSON
        run: |
          python - << 'EOF'
          import json
          with open('service_account.json') as f:
              json.load(f)
          print('✅ service_account.json is valid JSON')
          EOF

      - name: Run live import
        run: |
          python monitor-nitter.py --live
