name: "🐦 Twitter Import (v1.1 OAuth 1.0a)"

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 跑一次
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式: live 或 historical"
        required: false
        default: "live"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tweepy requests gspread google-auth lxml

      - name: Write Google creds (service_account.json)
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 --decode > service_account.json

      - name: Validate credentials JSON
        run: |
          python - << 'EOF'
          import json
          with open('service_account.json') as f:
            json.load(f)
          print('✅ service_account.json is valid JSON')
          EOF

      - name: Run monitor (v1.1)
        env:
          TW_API_KEY:       ${{ secrets.TW_API_KEY }}
          TW_API_SECRET:    ${{ secrets.TW_API_SECRET }}
          TW_ACCESS_TOKEN:  ${{ secrets.TW_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TW_ACCESS_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=live; fi
          python monitor_v1.py --$MODE
